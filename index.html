<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Permette lo scorrimento verticale per leggere comodamente il testo lungo */
            overflow-y: auto; 
            cursor: pointer;
            user-select: none;
            text-align: center;
        }

        /* Stile della scritta iniziale 404 */
        h1 {
            font-size: 3rem;
            letter-spacing: 0.5rem;
            font-weight: 400;
            margin: 0;
            opacity: 0.9;
            transition: opacity 0.5s ease;
            position: absolute;
        }

        /* Contenitore della poesia e della prima linea */
        #container-poesia {
            opacity: 0;
            transition: opacity 1s ease;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        #poesia {
            font-size: 1.6rem;
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* Prima linea lenta (es. 12 secondi) */
        #linea {
            width: 250px;
            height: 2px;
            background-color: #ffffff;
            transition: width 12s linear, opacity 1s ease; 
        }

        /* Contenitore dell'immagine e della seconda linea lenta */
        #container-immagine {
            opacity: 0;
            transition: opacity 1s ease;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        #immagine-finale {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        /* Seconda linea lenta (es. 20 secondi) */
        #linea-lenta {
            width: 300px;
            height: 2px;
            background-color: #ffffff;
            transition: width 20s linear, opacity 1s ease; 
        }

        /* Contenitore del testo finale lungo (360 parole) - Ora scorrevole e posizionato correttamente */
        #testo-lungo {
            opacity: 0;
            transition: opacity 1.5s ease;
            position: relative; /* Permette alla pagina di allungarsi ed essere scrollata */
            max-width: 700px;
            width: 100%;
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 300;
            text-align: left;
            padding: 20px 0;
            pointer-events: auto;
            margin: auto;
        }
    </style>
</head>
<body>

    <!-- La scritta iniziale -->
    <h1 id="titolo">404</h1>

    <!-- Fase 1: Poesia + Prima linea lenta -->
    <div id="container-poesia">
        <div id="poesia">
            C'è forse un dolce alla fine<br>
            di questo insipido pasto?
        </div>
        <div id="linea"></div>
    </div>

    <!-- Fase 2: Immagine + Seconda linea lenta -->
    <div id="container-immagine">
        <img id="immagine-finale" src="file_00000000266461f4871240ecb87d077a.png" alt="Sorpresa">
        <div id="linea-lenta"></div>
    </div>

    <!-- Fase 3: Il testo lungo finale (360 parole) -->
    <div id="testo-lungo">
        <p>Qui puoi incollare tutto il tuo testo lungo. Adesso la pagina scorrerà dolcemente in basso permettendo di leggerlo tutto senza che venga tagliato o nascosto dai bordi dello schermo...</p>
        <!-- Aggiungi qui i tuoi paragrafi con <p> ... </p> -->
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;

        function startFireplace() {
            if (isPlaying) return;
            isPlaying = true;
            
            // 1. Sparisce 404 e appare la poesia con la prima linea (12 secondi)
            document.getElementById('titolo').style.opacity = '0';
            const contPoesia = document.getElementById('container-poesia');
            contPoesia.style.opacity = '0.9';

            setTimeout(() => {
                document.getElementById('linea').style.width = '0px';
            }, 100);

            // 2. Dopo 12.1 secondi: sparisce la poesia e compare l'immagine con la seconda linea (20 secondi)
            setTimeout(() => {
                contPoesia.style.opacity = '0';
                const contImmagine = document.getElementById('container-immagine');
                contImmagine.style.opacity = '0.9';

                setTimeout(() => {
                    document.getElementById('linea-lenta').style.width = '0px';
                }, 100);

                // 3. Dopo altri 20.1 secondi: sparisce l'immagine e compare il testo lungo
                setTimeout(() => {
                    contImmagine.style.opacity = '0';

                    // TROCCOLINO EXTRA NEL FINALE: Un colpo secco/rumoretto elettronico o un pop speciale quando appare il testo
                    playFinalSound();

                    setTimeout(() => {
                        document.getElementById('testo-lungo').style.opacity = '1';
                    }, 1000);
                }, 20100);

            }, 12100);

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // --- CAMINETTO PULITO (come all'inizio) ---
                const bufferSize = 2 * audioCtx.sampleRate;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.25;

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                whiteNoise.start();

                // Scoppiettii normali del fuoco
                function popCrackle() {
                    if (!isPlaying) return;
                    
                    const delay = Math.random() * 400 + 50;
                    setTimeout(() => {
                        if (!isPlaying) return;
                        
                        const popBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                        const popData = popBuffer.getChannelData(0);
                        for (let j = 0; j < popBuffer.length; j++) {
                            popData[j] = (Math.random() * 2 - 1) * Math.exp(-j / (audioCtx.sampleRate * 0.01));
                        }

                        const popSource = audioCtx.createBufferSource();
                        popSource.buffer = popBuffer;

                        const popFilter = audioCtx.createBiquadFilter();
                        popFilter.type = 'bandpass';
                        popFilter.frequency.value = Math.random() * 2000 + 1000;
                        popFilter.Q.value = 3;

                        const popGain = audioCtx.createGain();
                        popGain.gain.value = Math.random() * 0.4 + 0.1;

                        popSource.connect(popFilter);
                        popFilter.connect(popGain);
                        popGain.connect(audioCtx.destination);
                        
                        popSource.start();
                        popCrackle();
                    }, delay);
                }

                popCrackle();

            } catch (e) {
                console.log("Audio non avviato", e);
            }
        }

        // Funzione per il rumoretto extra nel momento esatto in cui appare il testo finale
        function playFinalSound() {
            if (!audioCtx) return;
            try {
                // Crea un piccolo suono sintetico suggestivo (un "thud" o un rintocco cupo)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.log("Audio extra non partito", e);
            }
        }

        document.addEventListener('click', () => {
            if (!isPlaying) {
                startFireplace();
            }
        }, { once: false });
    </script>
</body>
</html>
