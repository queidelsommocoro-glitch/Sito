<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }

        /* Stile della scritta iniziale 404 */
        h1 {
            font-size: 3rem;
            letter-spacing: 0.5rem;
            font-weight: 400;
            margin: 0;
            opacity: 0.9;
            transition: opacity 0.5s ease;
            position: absolute;
        }

        /* Contenitore della poesia e della linea */
        #container-poesia {
            opacity: 0;
            transition: opacity 1s ease;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        /* Stile della poesia */
        #poesia {
            font-size: 1.6rem;
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* La linea che scompare lentamente */
        #linea {
            width: 250px;
            height: 2px;
            background-color: #ffffff;
            transition: width 5s linear, opacity 1s ease; 
        }

        /* Immagine finale nascosta */
        #immagine-finale {
            opacity: 0;
            transition: opacity 1.5s ease;
            position: absolute;
            max-width: 80vw;
            max-height: 70vh;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- La scritta iniziale -->
    <h1 id="titolo">404</h1>

    <!-- La tua poesia e la linea raggruppate insieme -->
    <div id="container-poesia">
        <div id="poesia">
            C'è forse un dolce alla fine<br>
            di questo insipido pasto?
        </div>
        <div id="linea"></div>
    </div>

    <!-- Immagine finale corretta -->
    <img id="immagine-finale" src="file_00000000266461f4871240ecb87d077a.png" alt="Sorpresa">

    <script>
        let audioCtx = null;
        let isPlaying = false;

        function startFireplace() {
            if (isPlaying) return;
            
            // 1. Fai sparire la scritta 404 e comparire la poesia col blocco
            document.getElementById('titolo').style.opacity = '0';
            const contPoesia = document.getElementById('container-poesia');
            contPoesia.style.opacity = '0.9';

            // 2. Fai partire il rimpicciolimento della linea
            setTimeout(() => {
                document.getElementById('linea').style.width = '0px';
            }, 100);

            // 3. Dopo che la linea finisce (circa 5 secondi), sparisce la poesia e compare l'immagine
            setTimeout(() => {
                contPoesia.style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('immagine-finale').style.opacity = '1';
                }, 1000);
            }, 5100);

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = 2 * audioCtx.sampleRate;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.25;

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                whiteNoise.start();

                function popCrackle() {
                    if (!isPlaying) return;
                    
                    const delay = Math.random() * 400 + 50;
                    setTimeout(() => {
                        if (!isPlaying) return;
                        
                        const popBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                        const popData = popBuffer.getChannelData(0);
                        for (let j = 0; j < popBuffer.length; j++) {
                            popData[j] = (Math.random() * 2 - 1) * Math.exp(-j / (audioCtx.sampleRate * 0.01));
                        }

                        const popSource = audioCtx.createBufferSource();
                        popSource.buffer = popBuffer;

                        const popFilter = audioCtx.createBiquadFilter();
                        popFilter.type = 'bandpass';
                        popFilter.frequency.value = Math.random() * 2000 + 1000;
                        popFilter.Q.value = 3;

                        const popGain = audioCtx.createGain();
                        popGain.gain.value = Math.random() * 0.4 + 0.1;

                        popSource.connect(popFilter);
                        popFilter.connect(popGain);
                        popGain.connect(audioCtx.destination);
                        
                        popSource.start();
                        popCrackle();
                    }, delay);
                }

                popCrackle();
                isPlaying = true;

            } catch (e) {
                console.log("Audio non avviato", e);
            }
        }

        document.addEventListener('click', () => {
            if (!isPlaying) {
                startFireplace();
            }
        }, { once: false });
    </script>
</body>
</html>
